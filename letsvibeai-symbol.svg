<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="title desc">
<title id="title">LetsVibeAI Symbol</title>
<desc id="desc">A geometric V-shaped gateway with a central signal line and signal arcs, representing AI learning, direction and upward growth.</desc>
<defs>
  <linearGradient id="lvai" x1="70" y1="450" x2="530" y2="70" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#2F80ED"/>
    <stop offset=".48" stop-color="#7C5CFC"/>
    <stop offset="1" stop-color="#34D399"/>
  </linearGradient>
  <linearGradient id="signal" x1="280" y1="380" x2="320" y2="120" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#2F80ED"/>
    <stop offset="1" stop-color="#34D399"/>
  </linearGradient>
</defs>
<!-- V / gateway -->
<path d="M82 102 L184 102 L300 354 L416 102 L518 102 L351 418 Q300 491 249 418 Z"
      fill="url(#lvai)"/>
<!-- inner negative-space lift creates the slanted-L/V reading -->
<path d="M185 137 L225 137 L300 300 L375 137 L415 137 L323 340 Q300 377 277 340 Z"
      fill="#FFFFFF" opacity=".98"/>
<!-- central AI / learner signal -->
<rect x="286" y="174" width="28" height="155" rx="14" fill="url(#signal)"/>
<circle cx="300" cy="146" r="23" fill="url(#signal)"/>
<!-- signal arcs -->
<path d="M236 113 Q300 54 364 113" fill="none" stroke="#20C7D9" stroke-width="18" stroke-linecap="round"/>
<path d="M260 80 Q300 45 340 80" fill="none" stroke="#34D399" stroke-width="13" stroke-linecap="round"/>
</svg>