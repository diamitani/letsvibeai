<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gateway V Gradient -->
    <linearGradient id="lockupVGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFC" />
      <stop offset="35%" stop-color="#2F80ED" />
      <stop offset="70%" stop-color="#20C7D9" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="lockupSignalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20C7D9" />
      <stop offset="100%" stop-color="#2F80ED" />
    </linearGradient>

    <linearGradient id="lockupAiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F80ED" />
      <stop offset="100%" stop-color="#20C7D9" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(6, 6) scale(0.85)">
    <!-- Gateway V -->
    <path
      d="M 22 36 L 42 36 L 60 82 L 78 36 L 98 36 L 68 98 C 65 104 55 104 52 98 Z"
      fill="url(#lockupVGrad)"
    />

    <!-- Central Signal (Learner Stem & Node) -->
    <rect x="55.5" y="56" width="9" height="22" rx="4.5" fill="url(#lockupSignalGrad)" />
    <circle cx="60" cy="44" r="5.5" fill="url(#lockupSignalGrad)" />

    <!-- 3 Radiating Arcs -->
    <path d="M 50 30 C 56 26 64 26 70 30" stroke="url(#lockupVGrad)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 43 21 C 53 14 67 14 77 21" stroke="url(#lockupVGrad)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 36 12 C 50 3 70 3 84 12" stroke="url(#lockupVGrad)" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Wordmark & Tagline -->
  <g transform="translate(104, 0)">
    <!-- LetsVibe in Ink #10213F -->
    <text x="0" y="58" font-family="'Sora', sans-serif, -apple-system" font-size="38" font-weight="700" fill="#10213F" letter-spacing="-0.8">
      LetsVibe<tspan fill="url(#lockupAiGrad)">AI</tspan>
    </text>

    <!-- Tagline: LEARN • BUILD • SHIP -->
    <text x="3" y="82" font-family="'Sora', sans-serif, -apple-system" font-size="12" font-weight="700" fill="#2F80ED" letter-spacing="3.5">
      LEARN <tspan fill="#34D399">•</tspan> BUILD <tspan fill="#7C5CFC">•</tspan> SHIP
    </text>
  </g>
</svg>
