<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gateway V Gradient (Violet -> Signal Blue -> Cyan -> Growth Green) -->
    <linearGradient id="gatewayVGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFC" />
      <stop offset="35%" stop-color="#2F80ED" />
      <stop offset="70%" stop-color="#20C7D9" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Signal Center Gradient -->
    <linearGradient id="signalCenterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20C7D9" />
      <stop offset="100%" stop-color="#2F80ED" />
    </linearGradient>

    <!-- Arc Gradient -->
    <linearGradient id="arcGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F80ED" />
      <stop offset="50%" stop-color="#20C7D9" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Clean Precision Gateway V -->
  <!-- Left wing to apex to right wing with refined corner rounds -->
  <path
    d="M 22 36 L 42 36 L 60 82 L 78 36 L 98 36 L 68 98 C 65 104 55 104 52 98 Z"
    fill="url(#gatewayVGradient)"
  />

  <!-- Central Learner / Signal Stem (i) -->
  <rect
    x="55.5"
    y="56"
    width="9"
    height="22"
    rx="4.5"
    fill="url(#signalCenterGradient)"
  />

  <!-- Central Learner Node / Person Head -->
  <circle
    cx="60"
    cy="44"
    r="5.5"
    fill="url(#signalCenterGradient)"
  />

  <!-- 3 Radiating Signal Arcs (Learning -> Application -> Amplification) -->
  <!-- Arc 1 (Inner) -->
  <path
    d="M 50 30 C 56 26 64 26 70 30"
    stroke="url(#arcGradient)"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Arc 2 (Middle) -->
  <path
    d="M 43 21 C 53 14 67 14 77 21"
    stroke="url(#arcGradient)"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Arc 3 (Outer) -->
  <path
    d="M 36 12 C 50 3 70 3 84 12"
    stroke="url(#arcGradient)"
    stroke-width="3.5"
    stroke-linecap="round"
  />
</svg>
