  <path d="M28 32L50 72L72 32" stroke="url(#vibe-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="28" cy="32" r="4.5" fill="#10b981" />
  <circle cx="72" cy="32" r="4.5" fill="#38bdf8" />
  <circle cx="50" cy="72" r="5" fill="#06b6d4" />
  <circle cx="50" cy="45" r="3.5" fill="#ffffff" />
  <line x1="50" y1="45" x2="50" y2="72" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 3" stroke-opacity="0.6" />
</svg>
